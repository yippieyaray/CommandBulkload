# Managed release marker; leave unchanged. Configuration changes require a restart.
config-version: '${project.version}'
# Commands are dispatched one at a time. Server lag makes tick duration variable.
interval-ticks: 20
max-file-bytes: 1048576
max-commands: 10000
# Progress messages every this many dispatched commands, plus start and finish.
progress-every: 25
# en, de, es, fr, pt_br, pl, tr or own. own requires lang/own.yml.
language: de

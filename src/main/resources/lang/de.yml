# UTF-8, one line per message. Preserve named placeholders such as {file}.
prefix: '[CommandBulkload] '
enabled: 'Aktiviert. Upload-Ordner: {root}'
no-permission: 'Du hast keine Berechtigung für diesen Befehl.'
usage: 'Verwendung: commandbulkload <check|run> <filename.cbl> | <status|cancel>'
loading: 'Lese...'
checked: '{file} geprüft: {total} Kommandos; nichts abgesendet.'
started: '{file} gestartet: {total} Kommandos.'
progress: '{dispatched} von {total} abgesendet.'
status: '{state}: {file}; versucht {attempted}/{total}, abgesendet {dispatched}, Fehler {errors}, verbleibend {remaining}, letzte Zeile {line}.'
finished: 'abgeschlossen: {dispatched} abgesendet, {errors} Dispatch-Fehler, {remaining} verbleibend.'
stopped: '{state}: Zeile {line}; {dispatched} abgesendet, {errors} Dispatch-Fehler, {remaining} verbleibend. {reason}'
read-error: '{file} kann nicht gelesen oder vorbereitet werden: {reason}'
busy: 'Eine Datei wird gelesen oder ein Stapel läuft. Vor einem neuen Start abbrechen.'
idle: 'In dieser Serversitzung wurde noch kein Stapel ausgeführt.'
cancel-loading: 'Dateiladen abgebrochen; aus diesem Ladevorgang wird nichts abgesendet.'
no-run: 'Es gibt keinen aktiven Stapel zum Abbrechen.'
state.idle: 'Inaktiv'
state.running: 'Läuft'
state.completed: 'Abgeschlossen'
state.cancelled: 'Abgebrochen'
state.failed: 'Fehlgeschlagen'

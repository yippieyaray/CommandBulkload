# UTF-8, one line per message. Preserve named placeholders such as {file}.
prefix: '[CommandBulkload] '
enabled: 'Enabled. Upload directory: {root}'
no-permission: 'You do not have permission to use this command.'
usage: 'Usage: commandbulkload <check|run> <filename.cbl> | <status|cancel>'
loading: 'Reading...'
checked: 'Checked {file}: {total} commands; nothing dispatched.'
started: 'Started {file}: {total} commands.'
progress: '{dispatched} of {total} dispatched.'
status: '{state}: {file}; attempted {attempted}/{total}, dispatched {dispatched}, errors {errors}, remaining {remaining}, last line {line}.'
finished: 'Finished: {dispatched} dispatched, {errors} dispatch errors, {remaining} remaining.'
stopped: '{state}: line {line}; {dispatched} dispatched, {errors} dispatch errors, {remaining} remaining. {reason}'
read-error: 'Cannot read or prepare {file}: {reason}'
busy: 'A file is being read or a batch is running. Cancel it before starting another.'
idle: 'No batch has run in this server session.'
cancel-loading: 'File loading cancelled; no commands from this load will be dispatched.'
no-run: 'There is no active batch to cancel.'
state.idle: 'Idle'
state.running: 'Running'
state.completed: 'Completed'
state.cancelled: 'Cancelled'
state.failed: 'Failed'

# UTF-8, one line per message. Preserve named placeholders such as {file}.
prefix: '[CommandBulkload] '
enabled: 'Ativado. Diretório de arquivos: {root}'
no-permission: 'Você não tem permissão para usar este comando.'
usage: 'Uso: commandbulkload <check|run> <filename.cbl> | <status|cancel>'
loading: 'Lendo...'
checked: '{file} verificado: {total} comandos; nenhum enviado.'
started: '{file} iniciado: {total} comandos.'
progress: '{dispatched} de {total} enviados.'
status: '{state}: {file}; tentados {attempted}/{total}, enviados {dispatched}, erros {errors}, restantes {remaining}, última linha {line}.'
finished: 'concluído: {dispatched} enviados, {errors} erros de envio, {remaining} restantes.'
stopped: '{state}: linha {line}; {dispatched} enviados, {errors} erros de envio, {remaining} restantes. {reason}'
read-error: 'Não foi possível ler ou preparar {file}: {reason}'
busy: 'Há uma leitura ou um lote em andamento. Cancele antes de iniciar outro.'
idle: 'Nenhum lote foi executado nesta sessão.'
cancel-loading: 'Leitura cancelada; nenhum comando desta leitura será enviado.'
no-run: 'Não há lote ativo para cancelar.'
state.idle: 'Inativo'
state.running: 'Em andamento'
state.completed: 'Concluído'
state.cancelled: 'Cancelado'
state.failed: 'Falhou'

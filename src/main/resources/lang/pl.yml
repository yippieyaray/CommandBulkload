# UTF-8, one line per message. Preserve named placeholders such as {file}.
prefix: '[CommandBulkload] '
enabled: 'Włączono. Katalog przesyłanych plików: {root}'
no-permission: 'Nie masz uprawnienia do użycia tego polecenia.'
usage: 'Użycie: commandbulkload <check|run> <filename.cbl> | <status|cancel>'
loading: 'Odczytywanie...'
checked: 'Sprawdzono {file}: {total} poleceń; żadnego nie wysłano.'
started: 'Uruchomiono {file}: {total} poleceń.'
progress: 'wysłano {dispatched} z {total}.'
status: '{state}: {file}; próby {attempted}/{total}, wysłano {dispatched}, błędy {errors}, pozostało {remaining}, ostatni wiersz {line}.'
finished: 'Zakończono: wysłano {dispatched}, błędy wysyłania {errors}, pozostało {remaining}.'
stopped: '{state}: wiersz {line}; wysłano {dispatched}, błędy wysyłania {errors}, pozostało {remaining}. {reason}'
read-error: 'Nie można odczytać lub przygotować {file}: {reason}'
busy: 'Trwa odczyt lub wykonywanie partii. Anuluj przed rozpoczęciem kolejnej.'
idle: 'Nie wykonano żadnej partii w tej sesji.'
cancel-loading: 'Odczyt anulowany; żadne polecenie z tego odczytu nie zostanie wysłane.'
no-run: 'Brak aktywnej partii do anulowania.'
state.idle: 'Nieaktywny'
state.running: 'W toku'
state.completed: 'Zakończony'
state.cancelled: 'Anulowany'
state.failed: 'Błąd'

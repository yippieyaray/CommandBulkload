# UTF-8, one line per message. Preserve named placeholders such as {file}.
prefix: '[CommandBulkload] '
enabled: 'Activado. Directorio de carga: {root}'
no-permission: 'No tienes permiso para usar este comando.'
usage: 'Uso: commandbulkload <check|run> <filename.cbl> | <status|cancel>'
loading: 'Leyendo...'
checked: '{file} comprobado: {total} comandos; ninguno enviado.'
started: '{file} iniciado: {total} comandos.'
progress: '{dispatched} de {total} enviados.'
status: '{state}: {file}; intentados {attempted}/{total}, enviados {dispatched}, errores {errors}, pendientes {remaining}, última línea {line}.'
finished: 'terminado: {dispatched} enviados, {errors} errores de envío, {remaining} pendientes.'
stopped: '{state}: línea {line}; {dispatched} enviados, {errors} errores de envío, {remaining} pendientes. {reason}'
read-error: 'No se puede leer o preparar {file}: {reason}'
busy: 'Hay una lectura o un lote en curso. Cancélalo antes de iniciar otro.'
idle: 'No se ha ejecutado ningún lote en esta sesión.'
cancel-loading: 'Lectura cancelada; no se enviarán comandos de esta lectura.'
no-run: 'No hay ningún lote activo para cancelar.'
state.idle: 'Inactivo'
state.running: 'En curso'
state.completed: 'Terminado'
state.cancelled: 'Cancelado'
state.failed: 'Fallido'

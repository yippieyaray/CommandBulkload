# UTF-8, one line per message. Preserve named placeholders such as {file}.
prefix: '[CommandBulkload] '
enabled: 'Activé. Dossier des fichiers : {root}'
no-permission: 'Vous n’avez pas la permission d’utiliser cette commande.'
usage: 'Utilisation : commandbulkload <check|run> <filename.cbl> | <status|cancel>'
loading: 'Lecture de {file}...'
checked: '{file} vérifié : {total} commandes ; aucune envoyée.'
started: '{file} démarré : {total} commandes. Journal : {log}'
progress: '{file} : {dispatched} sur {total} envoyées.'
status: '{state} : {file} ; tentées {attempted}/{total}, envoyées {dispatched}, erreurs {errors}, restantes {remaining}, dernière ligne {line}.'
finished: '{file} terminé : {dispatched} envoyées, {errors} erreurs d’envoi, {remaining} restantes.'
stopped: '{state} : {file}, ligne {line} ; {dispatched} envoyées, {errors} erreurs d’envoi, {remaining} restantes. {reason}'
read-error: 'Impossible de lire ou préparer {file} : {reason}'
busy: 'Une lecture ou un lot est en cours. Annulez-le avant un nouveau démarrage.'
idle: 'Aucun lot exécuté pendant cette session.'
cancel-loading: 'Lecture annulée ; aucune commande de cette lecture ne sera envoyée.'
no-run: 'Aucun lot actif à annuler.'
state.idle: 'Inactif'
state.running: 'En cours'
state.completed: 'Terminé'
state.cancelled: 'Annulé'
state.failed: 'Échec'
